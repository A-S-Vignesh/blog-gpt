# TheBlogGPT: Next.js standalone on 127.0.0.1:3000, behind Cloudflare.
#
# Install (see docs/DEPLOY-ORACLE.md):
#   sudo cp ~/blog-gpt/deploy/oracle/nginx-thebloggpt.com.conf /etc/nginx/sites-available/thebloggpt.com
#   sudo ln -s /etc/nginx/sites-available/thebloggpt.com /etc/nginx/sites-enabled/thebloggpt.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Unlike chat-api.codolve.com (grey cloud + certbot) on this same box, this
# domain is proxied by Cloudflare (orange cloud). Cloudflare -> origin TLS uses
# a Cloudflare Origin Certificate with SSL/TLS mode "Full (strict)", so there
# is no certbot and nothing to renew for 15 years.
#
# No `http2` on the listen lines on purpose: on nginx 1.24 it is per
# address:port, so it would also switch on HTTP/2 for chat-api's Socket.IO.
# Cloudflare speaks HTTP/1.1 to origins by default anyway.

# Plain HTTP -> canonical HTTPS host. Cloudflare's "Always Use HTTPS" usually
# answers before a request ever gets here.
server {
    listen 80;
    listen [::]:80;
    server_name thebloggpt.com www.thebloggpt.com;
    return 301 https://thebloggpt.com$request_uri;
}

# www -> apex. The canonical URL everywhere in the app is https://thebloggpt.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.thebloggpt.com;

    ssl_certificate     /etc/ssl/cloudflare/thebloggpt.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thebloggpt.com.key;

    return 301 https://thebloggpt.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thebloggpt.com;

    ssl_certificate     /etc/ssl/cloudflare/thebloggpt.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/thebloggpt.com.key;

    # ── Real visitor IP ──────────────────────────────────────────────────
    # Every request arrives from a Cloudflare edge IP. CF-Connecting-IP is
    # trusted ONLY when the connection really comes from Cloudflare, so a
    # direct hit on this IP can't forge it. After this, $remote_addr is the
    # visitor. Ranges from https://www.cloudflare.com/ips/ (checked 2026-09-28).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Post bodies can carry a base64 cover image on its way to Cloudinary.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Host must be the public one: NextAuth, the redirects in
        # src/proxy.ts and the admin same-origin check in
        # src/lib/admin/guard.ts all read it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # OVERWRITE, never append ($proxy_add_x_forwarded_for). The rate
        # limiter (src/lib/rateLimit.ts) trusts the FIRST X-Forwarded-For
        # entry, and a visitor can put anything there before Cloudflare adds
        # its own. $remote_addr is already the verified visitor IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        # Let streamed (Suspense) HTML reach the browser as it renders.
        proxy_buffering off;

        # AI generation can run long; Cloudflare itself cuts off at 100s.
        proxy_read_timeout 120s;
    }
}
